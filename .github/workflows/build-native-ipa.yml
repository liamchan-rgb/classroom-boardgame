name: Build personal iPad app

# Manual runs only. No Apple credentials, provisioning profiles or paid runners.
on:
  workflow_dispatch:
    inputs:
      archive_only:
        description: "Archive and publish the already verified Meadow bridge build only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: classroom-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.archive_only }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select compatible Xcode and confirm SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 native/tools/select_ci_xcode.py --github-env "$GITHUB_ENV" \
            2>&1 | tee artifacts/xcode-selection.log
      - name: Record selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version 2>&1 | tee artifacts/xcode-version.txt
          xcodebuild -showsdks 2>&1 | tee artifacts/xcode-sdks.txt
      - name: Test offline core
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path native/Packages/ProbeCore 2>&1 | tee artifacts/core-tests.log
          swift test --package-path native/Packages/GameCore 2>&1 | tee artifacts/game-core-tests.log
      - name: Build unsigned iPad app
        shell: bash
        run: |
          set -euo pipefail
          python3 native/tools/validate_xcode_project.py
          xcodebuild -resolvePackageDependencies \
            -project native/ClassroomProbe.xcodeproj -scheme ClassroomProbe \
            2>&1 | tee artifacts/dependencies.log
          xcodebuild -project native/ClassroomProbe.xcodeproj -scheme ClassroomProbe \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath native/build -archivePath native/build/ClassroomProbe.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive \
            2>&1 | tee artifacts/xcode-build.log
      - name: Package for free personal signing
        shell: bash
        run: |
          set -euo pipefail
          app_path='native/build/ClassroomProbe.xcarchive/Products/Applications/ClassroomProbe.app'
          lipo -archs "$app_path/ClassroomProbe" | tee artifacts/architectures.txt
          test "$(lipo -archs "$app_path/ClassroomProbe")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" = "0.12.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" = "13"
          python3 native/tools/package_ipa.py "$app_path" artifacts/ClassroomStage2-v0.12.1-unsigned.ipa
          cp native/安装与真机验收.md artifacts/
          cp stage2/阶段2验收.md artifacts/
          cp docs/integration/meadow-v0.12.md artifacts/v0.12.1-integration.md
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-commit.txt
      - name: Retain IPA and diagnostics briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClassroomStage2-v0.12.1-build
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

  archive_verified_bridge:
    if: ${{ inputs.archive_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch complete source history without binary backup branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --unshallow --filter=blob:none origin main "${GITHUB_REF_NAME}"
      - name: Archive, restore-check, publish and verify public bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/publish_meadow_milestone.py
      - name: Retain publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meadow-bridge-archive-receipt
          path: ${{ runner.temp }}/meadow-milestone/archive_publish_receipt.json
          retention-days: 14
          if-no-files-found: warn
