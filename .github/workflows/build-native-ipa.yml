name: Build side-view battle prototype for iPad

# Manual runs only. No Apple credentials, provisioning profiles or paid runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select compatible Xcode and confirm SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 native/tools/select_ci_xcode.py --github-env "$GITHUB_ENV" \
            2>&1 | tee artifacts/xcode-selection.log
      - name: Record selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version 2>&1 | tee artifacts/xcode-version.txt
          xcodebuild -showsdks 2>&1 | tee artifacts/xcode-sdks.txt
      - name: Test offline core
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path native/Packages/ProbeCore 2>&1 | tee artifacts/core-tests.log
          swift test --package-path native/Packages/GameCore 2>&1 | tee artifacts/game-core-tests.log
      - name: Build unsigned iPad app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project native/ClassroomProbe.xcodeproj -scheme ClassroomProbe \
            2>&1 | tee artifacts/dependencies.log
          xcodebuild -project native/ClassroomProbe.xcodeproj -scheme ClassroomProbe \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath native/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee artifacts/xcode-build.log
      - name: Install pinned image validation dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            --target "$RUNNER_TEMP/classroom-image-validation" Pillow==11.3.0
      - name: Package for free personal signing
        shell: bash
        run: |
          set -euo pipefail
          app_path='native/build/Build/Products/Release-iphoneos/ClassroomProbe.app'
          lipo -archs "$app_path/ClassroomProbe" | tee artifacts/architectures.txt
          test "$(lipo -archs "$app_path/ClassroomProbe")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" = "0.11"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" = "11"
          python3 native/tools/package_ipa.py "$app_path" artifacts/ClassroomStage2-v0.11-unsigned.ipa
          cp native/安装与真机验收.md artifacts/
          cp stage2/阶段2验收.md artifacts/
          cp stage2/battle-prototype-v0.11/README.md artifacts/v0.11-side-battle.md
          PYTHONPATH="$RUNNER_TEMP/classroom-image-validation" python3 native/tools/verify_art_integration.py \
            --ipa artifacts/ClassroomStage2-v0.11-unsigned.ipa --output artifacts/asset-verification.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-commit.txt
      - name: Render native visual fixtures on simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPad" in v["name"]))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project native/ClassroomProbe.xcodeproj -scheme ClassroomProbe \
            -configuration Debug -destination "id=$device_id" -derivedDataPath native/simulator-build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > artifacts/simulator-build.log 2>&1
          xcrun simctl install "$device_id" native/simulator-build/Build/Products/Debug-iphonesimulator/ClassroomProbe.app
          xcrun simctl launch --console-pty "$device_id" org.personal.classroom.stage0 --visual-check > artifacts/visual-validation-console.log 2>&1 &
          visual_console_pid=$!
          app_data=$(xcrun simctl get_app_container "$device_id" org.personal.classroom.stage0 data)
          for attempt in {1..60}; do
            test ! -f "$app_data/Documents/visual-validation/complete.txt" || break
            sleep 1
          done
          if test -d "$app_data/Documents/visual-validation"; then cp -R "$app_data/Documents/visual-validation" artifacts/; fi
          kill "$visual_console_pid" || true
          test -f "$app_data/Documents/visual-validation/complete.txt"
      - name: Retain IPA and diagnostics briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClassroomStage2-v0.11-side-battle-build
          path: artifacts/
          retention-days: 3
          if-no-files-found: warn
