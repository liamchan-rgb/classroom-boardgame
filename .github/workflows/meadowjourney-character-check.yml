name: MeadowJourney IPA (character baker)

# 在本仓库已验证的 macOS/Xcode 运行器上，把 experiment 仓库的 MeadowJourney 快照（ci/meadowjourney）
# 编译成设备版 Release、打包成未签名 IPA，并发布一个带直接下载链接的预发布版本，供 SideStore 侧载。
# 不运行模拟器或真机，不签名，不触碰桌游 App（native/）。
on:
  push:
    branches:
      - claude/hd2d-pixel-character-walk-s2pdwi
    paths:
      - 'ci/meadowjourney/**'
      - '.github/workflows/meadowjourney-character-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meadowjourney-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned MeadowJourney IPA
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ci/meadowjourney
    env:
      PROJECT: MeadowJourney.xcodeproj
      SCHEME: MeadowJourney
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain and project validation
        run: |
          set -euo pipefail
          mkdir -p build/logs
          cat SOURCE_COMMIT | tee build/logs/source-commit.txt
          xcodebuild -version 2>&1 | tee build/logs/xcode-version.log
          python3 scripts/validate-project.py 2>&1 | tee build/logs/validate.log

      - name: Archive for iPhone / iPad without signing
        run: |
          set -euo pipefail
          status=0
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MeadowJourney.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > build/logs/archive.log 2>&1 || status=$?
          grep -E "error:|\*\* ARCHIVE" build/logs/archive.log | sort -u | head -80 || true
          exit "$status"

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          app='build/MeadowJourney.xcarchive/Products/Applications/MeadowJourney.app'
          lipo -archs "$app/MeadowJourney" | tee build/logs/archs.txt
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          echo "version=$version build=$build" | tee build/logs/version.txt
          test -d "$app/CharacterParts/hair" && test -d "$app/CharacterParts/face"
          ipa="build/MeadowJourney-v$version-${GITHUB_SHA::8}-unsigned.ipa"
          bash scripts/package-ipa.sh build/MeadowJourney.xcarchive "$ipa" 2>&1 | tee build/logs/package.log
          shasum -a 256 "$ipa" | tee build/logs/ipa.sha256
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release with a direct IPA link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::8}"; tag="meadowjourney-character-$short"
          ipa='${{ steps.package.outputs.ipa }}'
          notes="MeadowJourney 人物换装测试包（未签名，供 SideStore 侧载）。experiment 源码提交 $(cat SOURCE_COMMIT)；本仓库提交 ${GITHUB_SHA}。设备 Release 编译，未运行模拟器或真机。$(cat build/logs/version.txt) SHA256: $(cut -d' ' -f1 build/logs/ipa.sha256)"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$ipa" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "MeadowJourney 人物换装测试包 $short" --notes "$notes"
          echo "IPA: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$ipa")" | tee build/logs/ipa-url.txt

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meadowjourney-ipa-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/meadowjourney/build/logs
          retention-days: 14
          if-no-files-found: ignore
