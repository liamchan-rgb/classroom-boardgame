">✓ 可用（由真实规则投影提供）</text><text x="72" y="745" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#173F50" text-anchor="start">4:3最长技能：每页2张，2页；18物品另页每页6种，3页。</text><text x="72" y="790" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#496977" text-anchor="start">教师切页只改变展示；顶部固定当前行动者；公开端不显示教师选中的技能/目标。</text><text x="72" y="840" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#496977" text-anchor="start">不得按职业写死3技能；套装技能来自本局有效技能集合与剩余次数。</text><text x="72" y="920" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#496977" text-anchor="start">仅审图的压力样例：物品/套装拥有情况明确由场景fixture提供，不代表原存档。</text></svg>